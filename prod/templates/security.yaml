AWSTemplateFormatVersion: '2010-09-09'
Description: BEM13 ECS CICD | Stack 2 of 9 — Security groups (least-privilege)

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  ProjectName:
    Type: String
    Default: bem14
  AppPort:
    Type: Number
    Default: 8080

Resources:

  # ── ALB Security Group ─────────────────────────────────────────
  # Public-facing: allows HTTP (80) production traffic only.
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP from internet
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP production traffic
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          CidrIp:
            Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcCidr"
          Description: Forward to ECS tasks
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-alb-sg"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── ECS Task Security Group ────────────────────────────────────
  # Private: only accepts traffic originating from the ALB SG.
  EcsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS tasks - inbound from ALB only
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref AppPort
          ToPort: !Ref AppPort
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: App traffic from ALB only
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-ecs-sg"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── VPC Endpoint Security Group ────────────────────────────────
  # Allows HTTPS from ECS tasks so they can reach ECR / CloudWatch
  # without traversing the public internet.
  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC Endpoints - HTTPS from ECS tasks
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp:
            Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcCidr"
          Description: HTTPS from within the VPC
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-endpoint-sg"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── RDS Security Group ─────────────────────────────────────────
  # Only ECS tasks may reach PostgreSQL — no public access.
  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL inbound from ECS tasks only
      VpcId:
        Fn::ImportValue: !Sub "${Environment}-${ProjectName}-VpcId"
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref EcsSecurityGroup
          Description: PostgreSQL from ECS tasks only
      Tags:
        - Key: Name
          Value: !Sub "${Environment}-${ProjectName}-rds-sg"
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

Outputs:
  AlbSgId:
    Value: !Ref AlbSecurityGroup
    Export:
      Name: !Sub "${Environment}-${ProjectName}-AlbSgId"

  EcsSgId:
    Value: !Ref EcsSecurityGroup
    Export:
      Name: !Sub "${Environment}-${ProjectName}-EcsSgId"

  VpcEndpointSgId:
    Value: !Ref VpcEndpointSecurityGroup
    Export:
      Name: !Sub "${Environment}-${ProjectName}-VpcEndpointSgId"

  RdsSgId:
    Value: !Ref RdsSecurityGroup
    Export:
      Name: !Sub "${Environment}-${ProjectName}-RdsSgId"
