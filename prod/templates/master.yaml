AWSTemplateFormatVersion: '2010-09-09'
Description: >
  BEM14 S3 App | Master stack — deploys 11 stacks in dependency order via one GitSync link.
  Prerequisite (deploy first via GitSync using foundation/deployment.yaml):
    - foundation/foundation.yaml   → stack: prod-bem14-foundation

Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, test, prod]
  ProjectName:
    Type: String
    Default: bem14
  TemplateBaseUrl:
    Type: String
    Description: S3 URL prefix where individual templates are stored (no trailing slash)
    # Example: https://my-bucket.s3.amazonaws.com/ecs-cicd-infra/templates

  AppPort:
    Type: Number
    Default: 8080
  DesiredCount:
    Type: Number
    Default: 1
  MinCapacity:
    Type: Number
    Default: 1
  MaxCapacity:
    Type: Number
    Default: 4
  CpuScaleOutThreshold:
    Type: Number
    Default: 70
  TaskCpu:
    Type: String
    Default: '512'
  TaskMemory:
    Type: String
    Default: '1024'
  BlueTerminationWaitMinutes:
    Type: Number
    Default: 5

  # ── RDS parameters ─────────────────────────────────────────────
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
  DBName:
    Type: String
    Default: photodb
  MultiAZ:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  DBAllocatedStorage:
    Type: Number
    Default: 20
  DBEngineVersion:
    Type: String
    Default: '15.16'

Resources:

  # ── 01: Network ────────────────────────────────────────────────
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/network.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 02: Security Groups ────────────────────────────────────────
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: NetworkStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/security.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        AppPort: !Ref AppPort
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 03: IAM Roles ──────────────────────────────────────────────
  # ECR (foundation stack) is deployed independently before this master stack.
  # CAPABILITY_NAMED_IAM is declared in the master deployment file
  # and cascades to this nested stack automatically.
  IamStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: SecurityStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/iam.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 04: VPC Endpoints ──────────────────────────────────────────
  EndpointsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: IamStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/endpoints.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 05: ALB ────────────────────────────────────────────────────
  AlbStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: EndpointsStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/alb.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        AppPort: !Ref AppPort
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 06: ECS Cluster, Task Definition, Service ─────────────────
  EcsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: AlbStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/ecs.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        AppPort: !Ref AppPort
        DesiredCount: !Ref DesiredCount
        MinCapacity: !Ref MinCapacity
        MaxCapacity: !Ref MaxCapacity
        CpuScaleOutThreshold: !Ref CpuScaleOutThreshold
        TaskCpu: !Ref TaskCpu
        TaskMemory: !Ref TaskMemory
        InitialImage:
          Fn::Sub:
            - "${Uri}:latest"
            - Uri:
                Fn::ImportValue: !Sub "${Environment}-${ProjectName}-RepositoryUri"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 07: CodeDeploy Application & Deployment Group ─────────────
  CodeDeployStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: EcsStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/codedeploy.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        BlueTerminationWaitMinutes: !Ref BlueTerminationWaitMinutes
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 08: S3 Artifact Bucket, EventBridge Rule, CodePipeline ────
  PipelineStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: CodeDeployStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/pipeline.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 09: RDS PostgreSQL + Secrets Manager ──────────────────────
  # Depends on IamStack (attaches policy to exec role) and implicitly
  # on NetworkStack/SecurityStack via Fn::ImportValue exports.
  RdsStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: PipelineStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/rds.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
        DBInstanceClass: !Ref DBInstanceClass
        DBName: !Ref DBName
        MultiAZ: !Ref MultiAZ
        DBAllocatedStorage: !Ref DBAllocatedStorage
        DBEngineVersion: !Ref DBEngineVersion
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 10: Private S3 Images Bucket + CloudFront OAC ─────────────
  # Depends on IamStack (attaches upload policy to task role).
  # Must come after RdsStack so all IAM policies are applied in order.
  StorageStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: RdsStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/storage.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync

  # ── 11: SSM Parameter Store ────────────────────────────────────
  # Must be last — imports exports from every preceding stack plus
  # the standalone foundation stack (ECR URI, role ARNs, bucket,
  # DB endpoint, images bucket, CloudFront domain).
  SsmStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: StorageStack
    Properties:
      TemplateURL: !Sub "${TemplateBaseUrl}/ssm.yaml"
      Parameters:
        Environment: !Ref Environment
        ProjectName: !Ref ProjectName
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: !Ref ProjectName
        - Key: ManagedBy
          Value: CloudFormation-GitSync
